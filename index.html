<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#09090a" />
    <!-- set language and direction before the first paint, so Arabic pages do not flip after load -->
    <script>
      (function () {
        var p = location.pathname;
        var ar = p === '/ar' || p.indexOf('/ar/') === 0;
        document.documentElement.lang = ar ? 'ar' : 'en';
        document.documentElement.dir = ar ? 'rtl' : 'ltr';
      })();
    </script>

    <!-- static defaults for link previews that do not run JavaScript; <Seo> replaces them per page -->
    <title data-static-seo>Abdulaziz Kanaan — Civil, Technical Office &amp; Structural Engineer, Jeddah</title>
    <meta data-static-seo name="description" content="Civil engineer in Jeddah: technical office and structural engineering on the Jeddah Historic District restoration in Al-Balad, a programme of more than 300 historic buildings. Projects, CV and an interactive 3D structural explorer." />
    <meta data-static-seo property="og:type" content="profile" />
    <meta data-static-seo property="og:title" content="Abdulaziz Kanaan — Civil, Technical Office &amp; Structural Engineer" />
    <meta data-static-seo property="og:description" content="Technical office and structural engineering on the Jeddah Historic District restoration, Al-Balad. Projects, CV and a 3D structural explorer." />
    <meta data-static-seo property="og:image" content="/og.jpg" />
    <meta data-static-seo name="twitter:card" content="summary_large_image" />

    <link rel="manifest" href="/site.webmanifest" />
